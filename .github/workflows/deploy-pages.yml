name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/digests/**"
  workflow_run:
    workflows: ["Daily Digest"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy data into web/ for a self-contained artifact
        run: cp -r data web/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
